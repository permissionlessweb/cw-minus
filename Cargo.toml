[workspace]
members = ["packages/*"]

resolver = "2"

[workspace.package]
version = "3.0.0"

[workspace.dependencies]
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a", package = "cosmwasm-schema" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a", package = "cosmwasm-std" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", rev = "cf066f8ca57cc30a7cf8f50fca9cf6e18291d71a" }
cw-utils = { path = "packages/cw-utils" }
schemars = "0.8.4"
semver = { version = "1.0.26", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror = "2.0.12"

[patch.'https://github.com/permissionlessweb/cw-minus']
cw-controllers = { path = "packages/controllers" }
cw-utils = { path = "packages/cw-utils" }
cw2 = { path = "packages/cw2" }

# Force any transitive git CosmWasm (e.g. freeze tips in cw-storage-plus) onto monorepo paths.
[patch.'https://github.com/permissionlessweb/cosmwasm']
cosmwasm-core = { path = "../cosmwasm/packages/core", package = "cosmwasm-core" }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto", package = "cosmwasm-crypto" }
cosmwasm-derive = { path = "../cosmwasm/packages/derive", package = "cosmwasm-derive" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema", package = "cosmwasm-schema" }
cosmwasm-schema-derive = { path = "../cosmwasm/packages/schema", package = "cosmwasm-schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std", package = "cosmwasm-std" }
cw-schema = { path = "../cosmwasm/packages/cw-schema", package = "cw-schema" }
cw-schema-derive = { path = "../cosmwasm/packages/cw-schema", package = "cw-schema" }

[patch.'https://github.com/permissionlessweb/cw-storage-plus']
cw-storage-plus = { path = "../cw-storage-plus" }

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
