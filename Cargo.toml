[workspace]
members = ["packages/*"]

resolver = "2"

[workspace.package]
version = "3.0.0"

[workspace.dependencies]
cosmwasm-schema = { package = "cosmwasm-schema", version = "=4.0.0-zk" }
cosmwasm-std = { package = "cosmwasm-std", version = "=4.0.0-zk" }
cw-storage-plus = { version = "3.0.1" }
cw-utils = { path = "packages/cw-utils" }
schemars = "0.8.4"
semver = { version = "1.0.26", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror = "2.0.12"
[patch.crates-io]

cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cw-storage-plus = { path = "../cw-storage-plus" }

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
