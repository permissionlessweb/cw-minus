[workspace]
members = ["packages/*"]

resolver = "2"

[workspace.package]
version = "3.0.0"

[workspace.dependencies]
cosmwasm-schema = { package = "cosmwasm-schema", version = "=4.1.0" }
cosmwasm-std = { package = "cosmwasm-std", version = "=4.1.0" }
cw-storage-plus = { version = "3.0.1" }
cw-utils = { path = "packages/cw-utils" }
schemars = "0.8.4"
semver = { version = "1.0.26", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror = "2.0.12"
[patch.crates-io]

cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", rev = "b303f445113c95427b57fc825bc033fdf3e6fee0" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
